@if (modal.actual(); as datos) {
  <div class="fondo" (click)="modal.cerrar(false)">
    <div
      class="modal card"
      [class]="datos.tipo"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-titulo"
      (click)="$event.stopPropagation()"
    >
      <div class="icono" aria-hidden="true">{{ iconos[datos.tipo] }}</div>
      <h2 id="modal-titulo">{{ datos.titulo || titulosPorDefecto[datos.tipo] }}</h2>

      @if (datos.mensajes.length === 1) {
        <p>{{ datos.mensajes[0] }}</p>
      } @else {
        <ul>
          @for (mensaje of datos.mensajes; track mensaje) {
            <li>{{ mensaje }}</li>
          }
        </ul>
      }

      <div class="acciones">
        @if (datos.textoCancelar) {
          <button type="button" class="btn btn-secundario" (click)="modal.cerrar(false)">
            {{ datos.textoCancelar }}
          </button>
        }
        <button
          #boton
          type="button"
          class="btn"
          [class.btn-primario]="!datos.peligro"
          [class.btn-peligro]="datos.peligro"
          (click)="modal.cerrar(true)"
        >
          {{ datos.textoBoton ?? 'Entendido' }}
        </button>
      </div>
    </div>
  </div>
}
