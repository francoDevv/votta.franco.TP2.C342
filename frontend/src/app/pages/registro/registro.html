<section class="pantalla-acceso">
  <div class="card acceso">
    <div class="acceso-encabezado">
      <img src="favicon.svg" alt="Platito" />
      <h1>Creá tu cuenta</h1>
      <p class="texto-suave">Sumate y compartí tus platos favoritos.</p>
    </div>

    <app-formulario-usuario [enviando]="enviando()" (enviar)="registrar($event)" />

    <p class="acceso-pie texto-suave">
      ¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a>
    </p>
  </div>
</section>
