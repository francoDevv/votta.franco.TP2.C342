<section class="pantalla-acceso">
  <div class="card acceso">
    <div class="acceso-encabezado">
      <img src="favicon.svg" alt="Platito" />
      <h1>Ingresá a Platito</h1>
      <p class="texto-suave">Descubrí qué pedir antes de llegar a la mesa.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="campo">
        <label for="identificador">Usuario o correo</label>
        <input id="identificador" formControlName="identificador" autocomplete="username" />
        @if (errorIdentificador(); as mensaje) {
          <span class="error">{{ mensaje }}</span>
        }
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="con-boton">
          <input
            id="password"
            [type]="verPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="ver"
            (click)="verPassword.set(!verPassword())"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ verPassword() ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        @if (errorPassword(); as mensaje) {
          <span class="error">{{ mensaje }}</span>
        }
      </div>

      <button type="submit" class="btn btn-primario btn-bloque" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="acceso-pie texto-suave">
      ¿No tenés cuenta? <a routerLink="/registro">Registrate</a>
    </p>
  </div>
</section>
